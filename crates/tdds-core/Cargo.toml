# Used for `tier::fetch_and_install_remote` — the runtime override
# fetches the latest `openapiv3.yaml` from `docs.thetadata.us` so a
# desktop install picks up tier changes ThetaData publishes after
# the binary was built. Re-uses the rustls-backed reqwest already
# pulled in transitively via thetadatadx, so no extra TLS bloat.
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
