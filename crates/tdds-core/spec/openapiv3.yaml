  /index/history/price:
    x-min-subscription: value
    x-history-access: true
    get:
      summary: Price
      operationId: index_history_price
      x-codeSamples:
        - lang: Python
          label: pandas
          source: |
            from thetadata import ThetaClient

            client = ThetaClient(dataframe_type='pandas')
            df = client.index_history_price(symbol='SPX', interval='1m')

        - lang: Python
          label: polars
          source: |
            from thetadata import ThetaClient

            client = ThetaClient(dataframe_type='polars')
            df = client.index_history_price(symbol='SPX', interval='1m')

      tags:
        - Index
        - History
      description: |
        - Retrieves historical indices price reports. [Exchanges](/Articles/Data-And-Requests/The-SIPs.html) typically generate a price report every second for popular indices like SPX.
        - When the ``interval`` parameter is specified, the returned data represents the price at the exact time of each timestamp. If the timestamp in the response is 10:30:00, the price field represents the price at that exact time of the day.
        - A price update from the exchange is omitted if the price remained the same from the previous update.
        - Multi-day requests are limited to 1 month of data.
      x-sample-urls:
        - url: http://127.0.0.1:25503/v3/index/history/price?symbol=SPX&date=20241104&interval=1m
          description: "Returns historical index price reports"
        - url: http://127.0.0.1:25503/v3/index/history/price?symbol=SPX&date=20241104&interval=1m&format=html
          description: Click to open in browser (HTML)
        - url: http://127.0.0.1:25503/v3/index/history/price?symbol=SPX&start_date=20241104&end_date=20241107&interval=1m
          description: "Returns historical index price reports"
        - url: http://127.0.0.1:25503/v3/index/history/price?symbol=SPX&start_date=20241104&end_date=20241107&interval=1m&format=html
          description: Click to open in browser (HTML)
      parameters:
        - $ref: "#/components/parameters/opt_date"
        - $ref: "#/components/parameters/single_symbol"
        - $ref: "#/components/parameters/start_time"
        - $ref: "#/components/parameters/end_time"
        - $ref: "#/components/parameters/interval"
        - $ref: "#/components/parameters/format"
        - $ref: "#/components/parameters/opt_start_date"
        - $ref: "#/components/parameters/opt_end_date"
      responses:
        '200':
          description: Returns historical index price reports
          content:
            text/csv:
              schema:
                type: array
                items: &items_index_history_price
                  type: object
                  properties:
                    timestamp:
                      type: string
                      format: date-time
                      description: The timestamp in YYYY-MM-DDTHH:mm:ss.SSS format.
                    price:
                      type: number
                      description: The trade price.
              example: "timestamp,price\r\n2024-11-04T09:30:00,0.0\r\n2024-11-04T09:31:00,5728.56\r\n2024-11-04T09:32:00,5725.48\r\
                \n2024-11-04T09:33:00,5726.57\r\n2024-11-04T09:34:00,5722.88\r\n"
            application/json:
              schema: &schema_index_history_price
                type: array
                items: *items_index_history_price
              example: |
