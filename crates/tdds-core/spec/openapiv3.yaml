          description: "Returns 5m interval implied volatility for an option contract"
        - url: http://127.0.0.1:25503/v3/option/history/greeks/implied_volatility?symbol=AAPL&expiration=20241108&strike=220.000&right=call&date=20241104&interval=5m&format=html
          description: Click to open in browser (HTML)
        - url: http://127.0.0.1:25503/v3/option/history/greeks/implied_volatility?symbol=AAPL&expiration=20241108&strike=220.000&right=call&start_date=20241104&end_date=20241107&interval=5m
          description: "Returns 5m interval implied volatility for an option contract between the specified dates (inclusive)"
        - url: http://127.0.0.1:25503/v3/option/history/greeks/implied_volatility?symbol=AAPL&expiration=20241108&strike=220.000&right=call&start_date=20241104&end_date=20241107&interval=5m&format=html
          description: Click to open in browser (HTML)
