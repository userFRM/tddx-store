                │ 2026-09-07 ┆ full_close  ┆ null     ┆ null     │
                │ 2026-11-26 ┆ full_close  ┆ null     ┆ null     │
                │ 2026-11-27 ┆ early_close ┆ 09:30:00 ┆ 13:00:00 │
                │ 2026-12-24 ┆ early_close ┆ 09:30:00 ┆ 13:00:00 │
                │ 2026-12-25 ┆ full_close  ┆ null     ┆ null     │
