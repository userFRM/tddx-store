  /option/history/trade_greeks/first_order:
    x-min-subscription: professional
    x-history-access: true
    get:
      summary: First Order Trade Greeks
      operationId: option_history_trade_greeks_first_order
      x-codeSamples:
        - lang: Python
          label: pandas
          source: |
            from thetadata import ThetaClient
            from datetime import date

            client = ThetaClient(dataframe_type='pandas')
            df = client.option_history_trade_greeks_first_order(symbol='AAPL', expiration=date(2024, 11, 8))

        - lang: Python
          label: polars
          source: |
            from thetadata import ThetaClient
            from datetime import date

            client = ThetaClient(dataframe_type='polars')
            df = client.option_history_trade_greeks_first_order(symbol='AAPL', expiration=date(2024, 11, 8))

      tags:
        - Option
        - History
      description: |
        - Returns the data for all contracts that share the same provided symbol and expiration.
        - Calculates greeks for every trade reported by [OPRA](/Articles/Data-And-Requests/The-SIPs.html).
        - The underlying price represents whatever the last underlying price was at the ``timestamp`` field. You can read more about how Theta Data calculates greeks [here](/Articles/Data-And-Requests/Option-Greeks.html).
        - Multi-day requests are limited to 1 month of data, and must specify an expiration.
      x-sample-urls:
        - url: http://127.0.0.1:25503/v3/option/history/trade_greeks/first_order?symbol=AAPL&expiration=20241108&date=20241104
          description: "Returns first order trade greeks for an option contract"
        - url: http://127.0.0.1:25503/v3/option/history/trade_greeks/first_order?symbol=AAPL&expiration=20241108&start_date=20241104&end_date=20241110
          description: "Returns first order trade greeks for an option contract between the specified dates (inclusive)"
        - url: http://127.0.0.1:25503/v3/option/history/trade_greeks/first_order?symbol=AAPL&expiration=*&date=20241104
          description: "Returns first order trade greeks for an full chain of option contracts"
        - url: http://127.0.0.1:25503/v3/option/history/trade_greeks/first_order?symbol=AAPL&expiration=*&date=20241104&format=html
          description: Click to open in browser (HTML)
