        - $ref: "#/components/parameters/opt_end_date"
      responses:
        '200':
          description: Returns every quote for an option contract
          content:
            text/csv:
              schema:
                type: array
                items: &items_option_history_quote
                  type: object
                  properties:
                    symbol:
                      type: string
                      description: The symbol of the contract, or stock / underlying asset / option / index.
                    expiration:
                      type: string
                      format: date
                      description: Expiration date of the contract in YYYY-MM-DD format.
                    strike:
                      type: number
