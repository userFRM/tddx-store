      operationId: index_history_ohlc
      x-codeSamples:
        - lang: Python
          label: pandas
          source: |
            from thetadata import ThetaClient
            from datetime import date

            client = ThetaClient(dataframe_type='pandas')
            df = client.index_history_ohlc(
