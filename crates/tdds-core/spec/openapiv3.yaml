        - $ref: "#/components/parameters/format"
        - $ref: "#/components/parameters/opt_start_date"
        - $ref: "#/components/parameters/opt_end_date"
      responses:
        '200':
          description: Returns OHLC for an option contract
          content:
            text/csv:
              schema:
                type: array
                items: &items_option_history_ohlc
                  type: object
                  properties:
                    symbol:
                      type: string
                      description: The symbol of the contract, or stock / underlying asset / option / index.
                    expiration:
                      type: string
                      format: date
                      description: Expiration date of the contract in YYYY-MM-DD format.
                    strike:
                      type: number
