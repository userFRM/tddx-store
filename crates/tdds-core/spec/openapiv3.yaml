components:
  parameters:
    # required parameters
    single_symbol:
      name: symbol
      in: query
      description: The stock or index symbol, or underlying symbol for options.
      required: true
      schema:
        type: string

    multi_symbol:
      name: symbol
      in: query
      description: The stock or index symbol, or underlying symbol for options. Specify '*' for all symbols or a comma separated list when appropriate.
      required: true
      schema:
        type: array
        items:
          type: string

    opt_multi_symbol:
      name: symbol
      in: query
      description: The stock or index symbol, or underlying symbol for options.
      required: false
      schema:
        type: array
        items:
          type: string

    date:
      name: date
      in: query
      description: The date to fetch data for.
      required: true
      schema:
        type: string
        format: date

    opt_date:
      name: date
      in: query
      description: The date to fetch data for. If present, this overrides start_date and end_date.
      required: false
      schema:
        type: string
        format: date

    end_date:
      name: end_date
      in: query
      description: The end date (inclusive).
      required: true
      schema:
        type: string
        format: date

    start_date:
      name: start_date
      in: query
      description: The start date (inclusive).
      required: true
      schema:
        type: string
        format: date

    opt_end_date:
      name: end_date
      in: query
      description: The end date (inclusive).
      required: false
      schema:
        type: string
        format: date

    opt_start_date:
      name: start_date
      in: query
      description: The start date (inclusive).
      required: false
      schema:
        type: string
        format: date

    year:
      name: year
      in: query
      description: The year to fetch data for.
      required: true
      schema:
        type: string

    time_of_day:
      name: time_of_day
      in: query
      description: The time of the day to fetch data for; assumed to be America/New_York.
      required: true
      schema:
        type: string
        format: time

    expiration:
      name: expiration
      in: query
      x-date-wildcard: true
      description: The expiration of the contract in `YYYY-MM-DD` or `YYYYMMDD` format, or `*` for all expirations.
      required: true
      schema:
        type: string
        format: date

    expiration_no_star:
      name: expiration
      in: query
      description: The expiration of the contract in `YYYY-MM-DD` or `YYYYMMDD` format.
      required: true
      schema:
        type: string
        format: date

    strike:
      name: strike
      in: query
      description: The strike price of the contract in dollars (ie `100.00` for `$100.00`), or `*` for all strikes.
      required: false
      schema:
        type: string
        default: "*"

    interval:
      name: interval
      in: query
      description: The size of the time interval must be one of the available options listed below. Intervals less than 1m are available only for single-day requests.
      required: true
      schema:
        type: string
        enum:
          - tick
          - 10ms
          - 100ms
          - 500ms
          - 1s
          - 5s
          - 10s
          - 15s
          - 30s
          - 1m
          - 5m
          - 10m
          - 15m
          - 30m
          - 1h
        default: 1s

    security_type:
      name: security_type
      in: path
      description: The security type.
      required: true
      schema:
        type: string
        enum:
          - stock
          - option
          - index

    request_type:
      name: request_type
      in: path
      description: The request type.
      required: true
      schema:
        type: string
        enum:
          - trade
          - quote


    # non-required parameters
    annual_dividend:
      name: annual_dividend
      in: query
      description: The annualized expected dividend amount to be used in Greeks calculations.
      required: false
      schema:
        type: number
        format: float

    end_time:
      name: end_time
      in: query
      description: The end time (inclusive) in the specified day (format 24-hour HH:MM:SS.SSS).
      required: false
      schema:
        type: string
        format: time
        default: "16:00:00"

    exclusive:
      name: exclusive
      in: query
      description: If you prefer to match quotes with timestamps that are < the trade timestamp.
      required: false
      schema:
        type: boolean
        default: true

    format:
      name: format
      in: query
      description: The format of the data when returned to the user.
      required: false
      schema:
        type: string
        enum:
          - csv
          - json
          - ndjson
          - html
        default: csv

    rate_type:
      name: rate_type
      in: query
      description: The interest rate type to be used in a Greeks calculation.
      required: false
      schema:
        type: string
        enum:
          - sofr
          - treasury_m1
          - treasury_m3
          - treasury_m6
          - treasury_y1
          - treasury_y2
          - treasury_y3
          - treasury_y5
          - treasury_y7
          - treasury_y10
          - treasury_y20
          - treasury_y30
        default: sofr

    rate_value:
      name: rate_value
      in: query
      description: The interest rate, as a percent, to be used in a Greeks calculation.
      required: false
      schema:
        type: number
        format: float
      example: 5.0

    right:
      name: right
      in: query
      description: The right (call or put) of the contract.
      required: false
      schema:
        type: string
        enum:
          - call
          - put
          - both
        default: both

    start_time:
      name: start_time
      in: query
      description: The start time (inclusive) in the specified day (format 24-hour HH:MM:SS.SSS).
      required: false
      schema:
        type: string
        format: time
        default: "09:30:00"

    stock_price:
      name: stock_price
      in: query
      description: The underlying stock price to be used in the Greeks calculation.
      required: false
      schema:
        type: number
        format: float

    venue:
      name: venue
      in: query
      description: Used to specify the venue of the real time or historic request. ``nqb`` = Nasdaq Basic; ``utp_cta`` = merged UTP & CTA.
      required: false
      schema:
        type: string
        enum:
          - nqb
          - utp_cta
        default: nqb

    greeks_version:
      name: version
      in: query
      description: Used to adjust Greeks calculation methodology. "1" uses a fixed .15 DTE for 0DTE; "latest" uses real TTE (down to a minimum of 1 hour)
      required: false
      schema:
        type: string
        enum:
          - "latest"
          - "1"
        default: "latest"

    underlyer_use_nbbo:
      name: underlyer_use_nbbo
      in: query
      description: Used to select underlyer pricing for Greeks calculation. "true" uses the midpoint of the NBBO; "false" uses the last trade price.
      required: false
      schema:
        type: boolean
        default: false

    max_dte:
      name: max_dte
      in: query
      description: If specified, only contracts with a full calendar day 'Days to Expiration' (DTE) less than or equal to this number will be returned.
      required: false
      schema:
        minimum: 0
        type: integer
        format: int32

    strike_range:
      name: strike_range
      in: query
      description: Limits the number of contracts returned relative to the underlying's spot price. For a specified value 'n', this returns 'n' strikes above and 'n' strikes below the spot price, plus one at-the-money (ATM) strike (where spot price = strike price), if available. This results in a maximum of `2n + 1` strikes.
      required: false
      schema:
        minimum: 1
        type: integer
        format: int32

    min_time:
      name: min_time
      in: query
      description: Filters snapshots to include only data with a timestamp greater or equal to the specified value (HH:mm:ss.SSS format).
      required: false
      schema:
        type: string
        format: time

    use_market_value:
      name: use_market_value
      in: query
      description: Use the market value bid, ask, and price
      required: false
      schema:
        type: boolean
        default: false


  responses:
    200_OK:
      description: ""
      content:
        text/csv:
          schema:
            type: string


