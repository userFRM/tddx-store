  /option/history/greeks/all:
    x-min-subscription: professional
    x-history-access: true
    get:
      summary: All Greeks
      operationId: option_history_greeks_all
      x-codeSamples:
        - lang: Python
          label: pandas
          source: |
            from thetadata import ThetaClient
            from datetime import date

            client = ThetaClient(dataframe_type='pandas')
            df = client.option_history_greeks_all(
                symbol='AAPL',
                expiration=date(2024, 11, 8),
                interval='10m',
            )

        - lang: Python
          label: polars
          source: |
            from thetadata import ThetaClient
            from datetime import date

            client = ThetaClient(dataframe_type='polars')
            df = client.option_history_greeks_all(
                symbol='AAPL',
                expiration=date(2024, 11, 8),
                interval='10m',
            )

      tags:
        - Option
        - History
      description: |
        - Returns the data for all contracts that share the same provided symbol and expiration. 
        - Calculated using the option and underlying midpoint price. If an interval size is specified (*highly recommended*), the option quote used in the calculation follows the same rules as the [quote](/operations/option_history_quote.html) endpoint. 
        - The underlying price represents whatever the last underlying price was at the ``timestamp`` field. You can read more about how Theta Data calculates greeks [here](/Articles/Data-And-Requests/Option-Greeks.html).
        - Multi-day requests are limited to 1 month of data.
      x-sample-urls:
        - url: http://127.0.0.1:25503/v3/option/history/greeks/all?symbol=AAPL&expiration=20241108&date=20241104&interval=10m
          description: "Returns all greeks for an option contract"
        - url: http://127.0.0.1:25503/v3/option/history/greeks/all?symbol=AAPL&expiration=20241108&date=20241104&interval=10m&format=html
          description: Click to open in browser (HTML)
        - url: http://127.0.0.1:25503/v3/option/history/greeks/all?symbol=AAPL&expiration=20241108&start_date=20241104&end_date=20241111&interval=10m
          description: "Returns all greeks for an option contract between the specified dates (inclusive)"
        - url: http://127.0.0.1:25503/v3/option/history/greeks/all?symbol=AAPL&expiration=20241108&start_date=20241104&end_date=20241111&interval=10m&format=html
          description: Click to open in browser (HTML)
      parameters:
