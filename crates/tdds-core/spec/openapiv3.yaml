  /option/history/ohlc:
    x-min-subscription: value
    x-history-access: true
    get:
      summary: Open High Low Close
      operationId: option_history_ohlc
      x-codeSamples:
        - lang: Python
          label: pandas
          source: |
            from thetadata import ThetaClient
            from datetime import date

            client = ThetaClient(dataframe_type='pandas')
            df = client.option_history_ohlc(
                symbol='AAPL',
                expiration=date(2023, 11, 3),
                interval='1m',
            )

        - lang: Python
          label: polars
          source: |
            from thetadata import ThetaClient
            from datetime import date

            client = ThetaClient(dataframe_type='polars')
            df = client.option_history_ohlc(
                symbol='AAPL',
                expiration=date(2023, 11, 3),
                interval='1m',
            )

      tags:
        - Option
        - History
      description: |
        - Aggregated OHLC bars that use [SIP rules](/Articles/Data-And-Requests/OHLC-EOD.html) for each bar. 
        - Time timestamp of the bar represents the opening time of the bar. For a trade to be part of the bar:  ``bar timestamp`` <= ``trade time`` < ``bar timestamp + interval``.
        - Multi-day requests are limited to 1 month of data.
      x-sample-urls:
        - url: http://127.0.0.1:25503/v3/option/history/ohlc?symbol=AAPL&expiration=20231103&strike=170.000&right=call&date=20231103&interval=1m
