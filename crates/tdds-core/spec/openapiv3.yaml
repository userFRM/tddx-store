  /stock/history/quote:
    x-min-subscription: value
    x-history-access: true
    get:
      summary: Quote
      operationId: stock_history_quote
      x-codeSamples:
        - lang: Python
          label: pandas
          source: |
            from thetadata import ThetaClient

            client = ThetaClient(dataframe_type='pandas')
            df = client.stock_history_quote(symbol='AAPL', interval='1m')

        - lang: Python
          label: polars
          source: |
            from thetadata import ThetaClient

            client = ThetaClient(dataframe_type='polars')
            df = client.stock_history_quote(symbol='AAPL', interval='1m')

      tags:
        - Stock
        - History
      description: |
        - Returns every NBBO quote reported by [UTP and CTA](/Articles/Data-And-Requests/The-SIPs). 
        - If the ``interval`` parameter is specified, the quote for each interval represents the last quote prior to the interval's timestamp. 
        - Set the ``venue`` parameter to ``nqb`` to access current-day real-time historic data from the [Nasdaq Basic feed](/Articles/Data-And-Requests/The-SIPs) if the account has a [stocks standard or pro subscription](https://www.thetadata.net/subscribe.html#stocks).
        - Multi-day requests are limited to 1 month of data.
      x-sample-urls:
        - url: http://127.0.0.1:25503/v3/stock/history/quote?symbol=AAPL&date=20240102&interval=1m
          description: "Returns every quote for a given symbol on the specified date with a one minute interval"
        - url: http://127.0.0.1:25503/v3/stock/history/quote?symbol=AAPL&date=20240102&interval=1m&format=html
          description: Click to open in browser (HTML)
        - url: http://127.0.0.1:25503/v3/stock/history/quote?symbol=AAPL&start_date=20240102&end_date=20240109&interval=1m
          description: "Returns every quote for a given symbol between specified dates (inclusive) with a one minute interval"
        - url: http://127.0.0.1:25503/v3/stock/history/quote?symbol=AAPL&start_date=20240102&end_date=20240109&interval=1m&format=html
          description: Click to open in browser (HTML)
      parameters:
        - $ref: "#/components/parameters/single_symbol"
        - $ref: "#/components/parameters/opt_date"
        - $ref: "#/components/parameters/interval"
        - $ref: "#/components/parameters/start_time"
        - $ref: "#/components/parameters/end_time"
        - $ref: "#/components/parameters/venue"
