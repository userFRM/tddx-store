  /option/history/eod:
    x-min-subscription: free
    x-history-access: true
    get:
      summary: End of Day
      operationId: option_history_eod
      x-codeSamples:
        - lang: Python
          label: pandas
          source: |
            from thetadata import ThetaClient
            from datetime import date

            client = ThetaClient(dataframe_type='pandas')
            df = client.option_history_eod(
                start_date=date(2024, 11, 4),
                end_date=date(2024, 11, 4),
                symbol='AAPL',
                expiration=date(2024, 11, 15),
            )

        - lang: Python
          label: polars
          source: |
            from thetadata import ThetaClient
            from datetime import date

            client = ThetaClient(dataframe_type='polars')
            df = client.option_history_eod(
                start_date=date(2024, 11, 4),
                end_date=date(2024, 11, 4),
                symbol='AAPL',
                expiration=date(2024, 11, 15),
            )

      tags:
        - Option
        - History
      description: |
        - Since [OPRA](/Articles/Data-And-Requests/The-SIPs.html) does not provide a national EOD report for options, Theta Data generates a national EOD report at 17:15 ET each day.
        - ``created`` represents the datetime the report was generated and ``last_trade`` represents the datetime of the last trade. 
        - The quote in the response represents the last NBBO reported by OPRA at the time of report generation. 
        - You can read more about EOD & OHLC data [here](/Articles/Data-And-Requests/OHLC-EOD.html).
      x-sample-urls:
        - url: http://127.0.0.1:25503/v3/option/history/eod?symbol=AAPL&expiration=20241115&strike=170.000&right=call&start_date=20241104&end_date=20241104
          description: "Returns EOD report for an option contract"
        - url: http://127.0.0.1:25503/v3/option/history/eod?symbol=AAPL&expiration=*&start_date=20241104&end_date=20241104
          description: "Returns EOD report for all option contracts"
        - url: http://127.0.0.1:25503/v3/option/history/eod?symbol=AAPL&expiration=*&start_date=20241104&end_date=20241104&format=html
          description: Click to open in browser (HTML)
      parameters:
