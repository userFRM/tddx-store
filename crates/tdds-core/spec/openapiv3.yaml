  /option/history/trade_greeks/all:
    x-min-subscription: professional
    x-history-access: true
    get:
      summary: All Trade Greeks
      operationId: option_history_trade_greeks_all
      x-codeSamples:
        - lang: Python
          label: pandas
          source: |
            from thetadata import ThetaClient
            from datetime import date

            client = ThetaClient(dataframe_type='pandas')
            df = client.option_history_trade_greeks_all(symbol='AAPL', expiration=date(2023, 11, 17))

        - lang: Python
          label: polars
          source: |
            from thetadata import ThetaClient
            from datetime import date

            client = ThetaClient(dataframe_type='polars')
            df = client.option_history_trade_greeks_all(symbol='AAPL', expiration=date(2023, 11, 17))

      tags:
        - Option
        - History
      description: |
        - Returns the data for all contracts that share the same provided symbol and expiration. 
        - Calculates greeks for every trade reported by [OPRA](/Articles/Data-And-Requests/The-SIPs.html).
        - The underlying price represents whatever the last underlying price was at the ``timestamp`` field. You can read more about how Theta Data calculates greeks [here](/Articles/Data-And-Requests/Option-Greeks.html).
        - Multi-day requests are limited to 1 month of data, and must specify an expiration.
      x-sample-urls:
        - url: http://127.0.0.1:25503/v3/option/history/trade_greeks/all?symbol=AAPL&expiration=20231117&date=20231110
          description: "Returns all trade greeks for an option contract"
        - url: http://127.0.0.1:25503/v3/option/history/trade_greeks/all?symbol=AAPL&expiration=20231117&start_date=20231110&end_date=20231116
          description: "Returns all trade greeks for an option contract between the specified dates (inclusive)"
        - url: http://127.0.0.1:25503/v3/option/history/trade_greeks/all?symbol=AAPL&expiration=*&date=20231110
          description: "Returns all trade greeks for an full chain of option contracts"
        - url: http://127.0.0.1:25503/v3/option/history/trade_greeks/all?symbol=AAPL&expiration=*&date=20231110&format=html
          description: Click to open in browser (HTML)
      parameters:
        - $ref: "#/components/parameters/opt_date"
        - $ref: "#/components/parameters/single_symbol"
        - $ref: "#/components/parameters/expiration"
        - $ref: "#/components/parameters/strike"
        - $ref: "#/components/parameters/right"
        - $ref: "#/components/parameters/start_time"
        - $ref: "#/components/parameters/end_time"
        - $ref: "#/components/parameters/annual_dividend"
        - $ref: "#/components/parameters/rate_type"
        - $ref: "#/components/parameters/rate_value"
        - $ref: "#/components/parameters/greeks_version"
        - $ref: "#/components/parameters/max_dte"
        - $ref: "#/components/parameters/strike_range"
        - $ref: "#/components/parameters/format"
        - $ref: "#/components/parameters/opt_start_date"
        - $ref: "#/components/parameters/opt_end_date"
      responses:
        '200':
          description: Returns all trade greeks for an option contract
