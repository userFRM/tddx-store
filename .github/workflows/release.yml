name: Release

# Tag-driven multi-platform release. Push a tag matching `v*.*.*` and
# the workflow:
#
#   1. `create-release` creates ONE draft GitHub release up-front and
#      surfaces its numeric `id`. Without this single-flight step the
#      three matrix jobs race to create the draft and the loser dies
#      with "Looking for a draft release with tag … not found" — the
#      bug that took down the Windows leg of v0.0.1 builds.
#   2. `publish-tauri` runs the platform matrix (Linux, macOS universal,
#      Windows). Each job passes `releaseId` so tauri-action attaches
#      bundles to the existing draft instead of creating its own.
#
# Trigger:
#   git tag v0.1.0 -m "first release"
#   git push --tags
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      - name: Create draft release
        id: create
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "TdDx Store ${{ github.ref_name }}"
          draft: true
          prerelease: false
          body: |
            See [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.

            **Downloads:**
            - macOS — universal `.dmg` (Apple Silicon + Intel)
            - Linux — `.deb`, `.AppImage`, `.rpm`
            - Windows — `.msi`, `.exe` (NSIS)

            Unsigned binaries: macOS users right-click → Open the first time;
            Windows users may see SmartScreen — click "More info" → "Run anyway".

  publish-tauri:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS: pin to macos-13 (Intel) instead of macos-latest. The
          # Apple Silicon runner's `bundle_dmg.sh` step flakes when
          # `hdiutil` collides with the runner's filesystem semantics —
          # tauri-apps/tauri-action#1116 and friends. macos-13 still
          # produces a universal binary via cross-compile and ships a
          # working DMG every time.
          - platform: macos-13
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04      # x86_64: .deb + .AppImage + .rpm
            args: ""
          - platform: windows-latest    # x86_64: .msi + .exe (NSIS)
            args: ""

    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        working-directory: apps/desktop

    steps:
      - uses: actions/checkout@v4

      - name: Install protoc (thetadatadx build-script)
        uses: arduino/setup-protoc@v3
        with:
          version: "27.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Linux deps for tauri
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            patchelf libfuse2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS targets (universal binary)
        if: matrix.platform == 'macos-13'
        run: |
          rustup target add x86_64-apple-darwin
          rustup target add aarch64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/desktop/package-lock.json

      - name: npm ci
        run: npm ci

      - name: tauri-action — build + attach to draft
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}
