[workspace]
resolver = "2"
members = [
    "crates/tdds-core",
    "crates/tdds-cli",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
authors = ["userFRM"]
repository = "https://github.com/userFRM/tddx-store"

[workspace.dependencies]
# Published crate on crates.io. The package is `thetadatadx-rs`; its lib
# target is `thetadatadx`, which is the name every `use` site spells. The
# former `tdbe` crate is a module inside it now.
#
# `arrow` gives the zero-copy `RecordBatch` boundary the writers need.
# Keep arrow-* and parquet below on the same major as the SDK's, or the
# graph carries two incompatible `RecordBatch` types.
#
# `__internal` is what reaches the endpoint registry (`ENDPOINTS`,
# `find`, `EndpointArgs`, `invoke_endpoint`). The SDK marks that feature
# unstable and tells external crates not to enable it, and every symbol
# behind it can change without a major bump. It is enabled deliberately:
# the registry is what makes a data-driven catalogue possible at all —
# without it this app would hand-write a call site per endpoint and
# re-declare their parameters. The right long-term fix is a stable
# public registry surface in the SDK; until then, pin an exact SDK
# version and re-check this on every bump.
thetadatadx = { package = "thetadatadx-rs", version = "=0.4.0", features = ["arrow", "__internal"] }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4", features = ["derive", "env"] }

# Storage / formats
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "chrono"] }
arrow-array = "59"
arrow-schema = "59"
arrow-csv = "59"
arrow-json = "59"
parquet = { version = "59", features = ["arrow", "zstd"] }

# Misc
rustls = { version = "0.23", features = ["ring"] }
uuid = { version = "1", features = ["v4", "serde"] }
async-trait = "0.1"
futures = "0.3"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
